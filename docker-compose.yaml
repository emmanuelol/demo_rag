services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    environment:
      - OLLAMA_MODELS=${OLLAMA_MODELS:-qwen2.5:7b-instruct-q4_K_M}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-4096}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.2}
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=1m
    ports:
      - "11434:11434"
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./scripts:/scripts:ro
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    tty: true
    entrypoint: ["/usr/bin/bash", "/entrypoint.sh"]

  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: qdrant
    user: "${QDRANT_USER:-0:0}"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "(command -v curl >/dev/null && curl -sf http://127.0.0.1:6333/readyz) || (command -v wget >/dev/null && wget -qO- http://127.0.0.1:6333/readyz >/dev/null) || (command -v nc >/dev/null && nc -z 127.0.0.1 6333) || (/bin/bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' 2>/dev/null) || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped


  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      - PHOENIX_PORT=6006
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/').read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped


  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rag_client
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
      - ./entrypoint_rag.sh:/entrypoint_rag.sh
      - ${DATASETS_DIR:-./datasets}:/datasets
      - ${MODELS_DIR:-./models}:/models
      - ${FASTEMBED_CACHE_DIR:-fastembed_cache}:/root/.cache/fastembed
    environment:
      - BASE_URL=http://ollama:11434
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
      - OTEL_EXPORTER_OTLP_TIMEOUT=500
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=${GRADIO_SERVER_PORT:-7860}
      - GRADIO_SHARE=${GRADIO_SHARE:-false}
      - FASTEMBED_CACHE_PATH=/root/.cache/fastembed
      - USE_GPU_EMBEDDINGS=${USE_GPU_EMBEDDINGS:-false}
    ports:
      - "${GRADIO_PORT:-7860}:${GRADIO_SERVER_PORT:-7860}"
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    tty: true
    entrypoint: ["/usr/bin/bash", "/entrypoint_rag.sh"]

  notebook:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: demo_rag_notebook
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
      - ${FASTEMBED_CACHE_DIR:-fastembed_cache}:/root/.cache/fastembed
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PHOENIX_HOST=phoenix
      - PHOENIX_PORT=4317
      - FASTEMBED_CACHE_PATH=/root/.cache/fastembed
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --ServerApp.token=''
    depends_on:
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  ollama_data:
  qdrant_data:
  fastembed_cache:


